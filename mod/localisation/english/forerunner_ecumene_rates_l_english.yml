l_english:
 auth_forerunner_ecumene:0 "Ecumene Council"
 auth_forerunner_ecumene_desc:0 "The Ecumene is governed through a vast council whose First Councilor is selected through infrequent, consequential elections."
 leader_trait_forerunner_rate_builder:0 "Builder Rate"
 leader_trait_forerunner_rate_builder_desc:0 "A member of the dominant Builder Rate: an architect of great works and of the political order that commands them."
 leader_trait_forerunner_rate_builder_security:0 "Builder Security"
 leader_trait_forerunner_rate_builder_security_desc:0 "A Builder assigned to protect the installations, works, and authority of the Ecumene."
 leader_trait_forerunner_rate_miner:0 "Miner Rate"
 leader_trait_forerunner_rate_miner_desc:0 "A planetary and stellar engineer, entrusted with the material reshaping of worlds."
 leader_trait_forerunner_rate_lifeworker:0 "Lifeworker Rate"
 leader_trait_forerunner_rate_lifeworker_desc:0 "A steward of living systems, conservation, and biological knowledge."
 leader_trait_forerunner_rate_juridical:0 "Juridical Rate"
 leader_trait_forerunner_rate_juridical_desc:0 "A guardian of law, investigation, administration, and Ecumene social order."
 leader_trait_forerunner_rate_engineer:0 "Engineer Rate"
 leader_trait_forerunner_rate_engineer_desc:0 "A technical maintainer whose indispensable labor receives little social standing."
 leader_trait_forerunner_rate_warrior_servant:0 "Warrior-Servant Rate"
 leader_trait_forerunner_rate_warrior_servant_desc:0 "A professional military leader in the second-lowest of the great Rates."
 leader_trait_forerunner_rate_promethean:0 "Promethean"
 leader_trait_forerunner_rate_promethean_desc:0 "A rare and prestigious Warrior-Servant, trained for fleet command, ground war, and the logistics of conquest."
 forerunner_rates:0 "Rate Primacy"
 forerunner_rates_desc:0 "All Rates remain part of the Ecumene. This policy selects which Rate presently receives exceptional institutional support."
 forerunner_lifeworker_councilor:0 "Lifeworker Representative"
 forerunner_lifeworker_councilor_desc:0 "A senior Lifeworker office within the playable cabinet of the Ecumene Council."
 forerunner_master_engineer_councilor:0 "Master Engineer"
 forerunner_master_engineer_councilor_desc:0 "A senior technical office responsible for the maintenance of the Ecumene's systems."
 forerunner_warrior_servant_councilor:0 "Warrior-Servant Representative"
 forerunner_warrior_servant_councilor_desc:0 "A senior military office within the Ecumene Council."

 # Government and authority aliases are localized here even when the dependency also supplies them.
 gov_ecumene_council:0 "Ecumene Council"
 gov_ecumene_council_desc:0 "The five-hundred-seat governing council of the Forerunner Ecumene, led by a First Councilor chosen through rare oligarchic elections."
 RT_FIRST_COUNCILOR:0 "First Councilor"

 # Expanded Rate identities.
 leader_trait_forerunner_rate_theoretical:0 "Theoretical Rate"
 leader_trait_forerunner_rate_theoretical_desc:0 "A pursuer of fundamental and forbidden questions whose inquiries often cross the boundaries accepted by other Rates."
 leader_trait_forerunner_rate_historian:0 "Historian Rate"
 leader_trait_forerunner_rate_historian_desc:0 "A keeper of the Ecumene's history, archives, institutional memory, and recovered past."
 leader_trait_forerunner_rate_weaver:0 "Weaver Rate"
 leader_trait_forerunner_rate_weaver_desc:0 "A storyteller and keeper of folklore whose narratives bind Forerunner culture across ages and worlds."
 leader_trait_forerunner_rate_speaker:0 "Speaker Rate"
 leader_trait_forerunner_rate_speaker_desc:0 "A master of rhetoric, persuasion, and public deliberation capable of moving courts and entire populations."
 leader_trait_forerunner_rate_interpreter:0 "Interpreter Rate"
 leader_trait_forerunner_rate_interpreter_desc:0 "A scholar of the Mantle who weighs doctrine, stewardship, and crimes committed against its obligations."

 # Complete Rate Primacy policy localization. Primacy is influence, not exclusion.
 policy_forerunner_rates:0 "Rate Primacy"
 policy_forerunner_rates_desc:0 "Choose the Rate granted the greatest institutional voice for the present era. Every other Rate remains active throughout the Ecumene."
 no_action:0 "Balanced Council"
 no_action_desc:0 "No single Rate receives exceptional institutional primacy."
 builder_rate:0 "Builder Primacy"
 builder_rate_desc:0 "Builders receive greater influence over the Council's great works and infrastructure program."
 miner_rate:0 "Miner Primacy"
 miner_rate_desc:0 "Miners receive greater influence over resource acquisition and planetary or stellar engineering."
 lifeworker_rate:0 "Lifeworker Primacy"
 lifeworker_rate_desc:0 "Lifeworkers receive greater influence over biology, medicine, ecosystems, and the stewardship of life."
 juridical_rate:0 "Juridical Primacy"
 juridical_rate_desc:0 "Juridicals receive greater influence over law, investigation, judgment, and civil administration."
 warrior_servant_rate:0 "Warrior-Servant Primacy"
 warrior_servant_rate_desc:0 "Warrior-Servants receive greater influence over the Ecumene's military readiness and defense."
 engineer_rate:0 "Engineer Primacy"
 engineer_rate_desc:0 "Engineers receive greater influence over maintenance, efficiency, machinery, and technical improvement."
 theoretical_rate:0 "Theoretical Primacy"
 theoretical_rate_desc:0 "Theoreticals receive greater freedom to pursue rare, dangerous, and unbounded lines of inquiry."
 historian_rate:0 "Historian Primacy"
 historian_rate_desc:0 "Historians receive greater influence over archives, archaeology, traditions, and institutional memory."
 weaver_rate:0 "Weaver Primacy"
 weaver_rate_desc:0 "Weavers receive greater influence over cultural memory, public meaning, and social cohesion."
 speaker_rate:0 "Speaker Primacy"
 speaker_rate_desc:0 "Speakers receive greater influence over diplomacy, rhetoric, and public mobilization."
 interpreter_rate:0 "Interpreter Primacy"
 interpreter_rate_desc:0 "Interpreters receive greater influence over the doctrine and institutional obligations of the Mantle."

 # Existing Rate council positions.
 forerunner_master_builder_councilor:0 "Master Builder"
 forerunner_master_builder_councilor_desc:0 "The senior Builder responsible for coordinating the Ecumene's immense construction program."
 forerunner_master_miner_councilor:0 "Master Miner"
 forerunner_master_miner_councilor_desc:0 "The senior Miner responsible for planetary and stellar resource development."
 forerunner_master_juridical_councilor:0 "Master Juridical"
 forerunner_master_juridical_councilor_desc:0 "The senior Juridical responsible for law, evidence, judgment, and Council procedure."

 # Rate-associated Council agendas.
 council_agenda_agenda_forerunner_great_works_name:0 "Great Works"
 council_agenda_agenda_forerunner_great_works_desc:0 "Concentrate the Ecumene's design, fabrication, and logistics capacity on vast new works."
 council_agenda_agenda_forerunner_review_of_the_council_name:0 "Review of the Council"
 council_agenda_agenda_forerunner_review_of_the_council_desc:0 "Conduct a comprehensive Juridical review of administration, law, and Council procedure."
 council_agenda_agenda_forerunner_unbounded_inquiry_name:0 "Unbounded Inquiry"
 council_agenda_agenda_forerunner_unbounded_inquiry_desc:0 "Permit Theoreticals to pursue rare and dangerous questions beyond customary boundaries."
 council_agenda_agenda_forerunner_harmonized_systems_name:0 "Harmonized Systems"
 council_agenda_agenda_forerunner_harmonized_systems_desc:0 "Standardize maintenance, reduce waste, and improve the Ecumene's engineered systems."
 council_agenda_agenda_forerunner_ecumene_readiness_name:0 "Readiness of the Ecumene"
 council_agenda_agenda_forerunner_ecumene_readiness_desc:0 "Prepare fleets, armies, and logistics for the defense of the Ecumene."
 council_agenda_agenda_forerunner_stellar_development_name:0 "Stellar Development"
 council_agenda_agenda_forerunner_stellar_development_desc:0 "Direct Miner expertise toward planetary resources, orbital stations, and stellar exploitation."
 council_agenda_agenda_forerunner_living_stewardship_name:0 "Living Stewardship"
 council_agenda_agenda_forerunner_living_stewardship_desc:0 "Coordinate biological research, ecological repair, and the careful reshaping of living worlds."
 council_agenda_agenda_forerunner_archive_continuity_name:0 "Continuity of the Archives"
 council_agenda_agenda_forerunner_archive_continuity_desc:0 "Recover the past, preserve institutional memory, and pass ancient experience to new generations."
 council_agenda_agenda_forerunner_shared_narrative_name:0 "Shared Narrative"
 council_agenda_agenda_forerunner_shared_narrative_desc:0 "Renew the stories that connect the Ecumene's peoples across worlds and ages."
 council_agenda_agenda_forerunner_voice_of_the_ecumene_name:0 "Voice of the Ecumene"
 council_agenda_agenda_forerunner_voice_of_the_ecumene_desc:0 "Mobilize the Speakers to persuade foreign courts and rally the Ecumene behind common purpose."
 council_agenda_agenda_forerunner_mantle_deliberation_name:0 "Deliberation on the Mantle"
 council_agenda_agenda_forerunner_mantle_deliberation_desc:0 "Charge the Interpreters with clarifying the Mantle's duties and their consequences for the Ecumene."

